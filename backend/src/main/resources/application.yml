spring:
  application:
    name: terra-ledger-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:terraledger}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:terraledger}
    password: ${MYSQL_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-prod-min-32-chars-long}
    expiry-seconds: ${JWT_EXPIRY_SECONDS:3600}
  hardhat:
    rpc-url: ${HARDHAT_RPC_URL:http://localhost:8545}
    private-key: ${BACKEND_WALLET_PRIVATE_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
  ipfs:
    api-url: ${IPFS_API_URL:http://localhost:5001}
  ocr:
    service-url: ${OCR_SERVICE_URL:http://localhost:8000}
